name: Daily FinMind status

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download observation list
        run: python scripts/get_watchlist.py --output data/StockID_TWSE_TPEX.csv
      - name: Update README status
        run: python scripts/update_daily_status.py --stock-list data/StockID_TWSE_TPEX.csv
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update daily FinMind status"
          git push
