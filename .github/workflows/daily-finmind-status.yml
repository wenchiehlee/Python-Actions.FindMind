name: Daily FinMind status

on:
  schedule:
    - cron: "30 1 * * *"     # Daily types (1,5,13,18)
    - cron: "30 2 * * 1"     # Weekly types (4,6,7,8,9,11,14,17,19)
    - cron: "30 3 1 * *"     # Monthly types (12,15,16)
  workflow_dispatch:
    inputs:
      types:
        description: "Comma-separated type IDs to run (e.g. '1,5,8'); leave empty to run every active type"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      FINDMIND_GMAIL_TOKEN: ${{ secrets.FINDMIND_GMAIL_TOKEN }}
      FINDMIND_GMAIL_TOKEN1: ${{ secrets.FINDMIND_GMAIL_TOKEN1 }}
      FINDMIND_GMAIL_TOKEN2: ${{ secrets.FINDMIND_GMAIL_TOKEN2 }}
      FINDMIND_GMAIL_TOKEN3: ${{ secrets.FINDMIND_GMAIL_TOKEN3 }}
      FINDMIND_GMAIL_TOKEN4: ${{ secrets.FINDMIND_GMAIL_TOKEN4 }}
      FINDMIND_GMAIL_TOKEN5: ${{ secrets.FINDMIND_GMAIL_TOKEN5 }}
      FINDMIND_GMAIL_TOKEN6: ${{ secrets.FINDMIND_GMAIL_TOKEN6 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download observation list
        run: python scripts/get_watchlist.py --output data/StockID_TWSE_TPEX.csv
      - name: Fetch FinMind CSV data
        run: |
          TYPES_ARG=""
          if [ -n "${{ github.event.inputs.types }}" ]; then
            TYPES_ARG="--types ${{ github.event.inputs.types }}"
          elif [ "${{ github.event.schedule }}" = "30 2 * * 1" ]; then
            TYPES_ARG="--types 4,6,7,8,9,11,14,17,19"
          elif [ "${{ github.event.schedule }}" = "30 3 1 * *" ]; then
            TYPES_ARG="--types 12,15,16"
          elif [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then
            TYPES_ARG="--types 1,5,13,18"
          fi
          python scripts/fetch_daily_finmind.py --stock-list data/StockID_TWSE_TPEX.csv $TYPES_ARG
      - name: Update README status
        run: python scripts/download_results_counts.py --stock-list data/StockID_TWSE_TPEX.csv --update-readme
      - name: Build stage1_raw combined CSVs
        run: python scripts/build_stage1_raw.py
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md financial/ data/stage1_raw/
          git diff --cached --quiet || git commit -m "chore: update daily FinMind status"
          git push
